name: update-skins

on:
  push:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

jobs:
  update-skins:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/github-script@v9
        continue-on-error: true
        with:
          github-token: ${{ secrets.REPOSITORY_DISPATCH_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
          script: |
            try {
              await github.rest.repos.createDispatchEvent({
                owner: context.repo.owner,
                repo: "skins",
                event_type: "deploy-skins"
              });
            } catch (e) {
              console.log("Skins dispatch skipped:", e.message);
            }
