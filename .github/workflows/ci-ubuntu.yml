name: ci-ubuntu

on:
  workflow_call:

jobs:
  build-ubuntu:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build pkg-config gettext check libglib2.0-dev
          sudo apt-get install -y e2fslibs-dev libaspell-dev libgpm-dev libncurses5-dev libslang2-dev libssh2-1-dev libx11-dev unzip

      - name: Build full configuration
        run: |
          cmake -S . -B build-full \
              -G Ninja \
              -DCMAKE_INSTALL_PREFIX="$(pwd)/build-full/install" \
              -DMC_ENABLE_WERROR=ON \
              -DMC_ENABLE_TESTS=ON

          cmake --build build-full -j$(nproc)
          ctest --test-dir build-full --output-on-failure
          cmake --install build-full

      - name: Build ncurses configuration
        run: |
          cmake -S . -B build-ncurses \
              -G Ninja \
              -DCMAKE_INSTALL_PREFIX="$(pwd)/build-ncurses/install" \
              -DMC_SCREEN_LIBRARY=ncurses \
              -DMC_ENABLE_WERROR=ON \
              -DMC_ENABLE_TESTS=ON

          cmake --build build-ncurses -j$(nproc)
          ctest --test-dir build-ncurses --output-on-failure

      - name: Build minimal configuration
        run: |
          cmake -S . -B build-minimal \
              -G Ninja \
              -DCMAKE_INSTALL_PREFIX="$(pwd)/build-minimal/install" \
              -DMC_ENABLE_WERROR=ON \
              -DMC_ENABLE_TESTS=ON \
              -DMC_ENABLE_ASSERT=OFF \
              -DMC_ENABLE_BACKGROUND=OFF \
              -DMC_WITH_VFS=OFF \
              -DMC_WITH_GPM=OFF \
              -DMC_WITH_INTERNAL_EDIT=OFF \
              -DMC_WITH_DIFF_VIEWER=OFF \
              -DMC_ENABLE_SUBSHELL=OFF \
              -DMC_MAINTAINER_MODE=OFF \
              -DCMAKE_DISABLE_FIND_PACKAGE_X11=TRUE

          cmake --build build-minimal -j$(nproc)
          ctest --test-dir build-minimal --output-on-failure

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: test-suite-logs-ubuntu
          path: build-*/**/*.log
