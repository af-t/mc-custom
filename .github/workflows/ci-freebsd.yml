name: ci-freebsd

on:
  workflow_call:
    inputs:
      CFLAGS:
        description: 'Custom CFLAGS'
        default: ''
        required: false
        type: string

jobs:
  build-freebsd:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7

      - name: Build on FreeBSD
        uses: vmactions/freebsd-vm@v1
        with:
          prepare: |
            pkg install -y cmake ninja pkgconf
            pkg install -y aspell check glib libssh2 libX11 python3

          run: |
            pw useradd test -d "$(pwd)"
            chown -R test $(pwd)

            su - test -c ' \
              \
              export CFLAGS="${{ inputs.CFLAGS }}" && \
              \
              cmake -S . -B build -G Ninja \
                -DCMAKE_INSTALL_PREFIX="$(pwd)/install-prefix" \
                -DMC_SCREEN_LIBRARY=ncurses \
                -DMC_ENABLE_WERROR=ON \
                -DMC_ENABLE_TESTS=ON \
                && \
              \
              cmake --build build && \
              ctest --test-dir build --output-on-failure && \
              cmake --install build \
            '

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: test-suite-logs-freebsd
          path: build/**/Testing/**/*.log
