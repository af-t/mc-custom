name: ci-solaris

on:
  workflow_call:

jobs:
  build-solaris:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7

      - name: Build on Solaris
        uses: vmactions/solaris-vm@v1
        with:
          release: "11.4-gcc"  # autoconf automake developer/gcc/gcc-c libtool pkg-config
          prepare: |
            pkg install --no-backup-be --no-refresh --accept -v \
              cmake ninja pkg-config \
              aspell check glib2 libssh2 libx11

          run: |
            useradd -d "$(pwd)" test
            chown -R test $(pwd)

            su - test -c ' \
              export PKG_CONFIG_PATH=/usr/lib/64/pkgconfig && \
              \
              cmake -S . -B build -G Ninja \
                -DCMAKE_INSTALL_PREFIX="$(pwd)/install-prefix" \
                -DMC_SCREEN_LIBRARY=ncurses \
                -DMC_ENABLE_WERROR=ON \
                -DMC_ENABLE_TESTS=ON \
                && \
              \
              cmake --build build && \
              ctest --test-dir build --output-on-failure && \
              cmake --install build \
            '

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: test-suite-logs-solaris
          path: build/**/Testing/**/*.log
